name: tests

on:
  push:
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install engines and test runner
        run: python -m pip install pypdfium2 pypdf pytest
      - name: Unit tests
        run: python -m pytest tests -q
      - name: Hook self-test
        run: python hooks/pdf_text_router.py --selftest
